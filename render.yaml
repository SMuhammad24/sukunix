services:
  - type: web
    name: sukunix
    env: node
    plan: free
    region: singapore # or oregon / frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: COMPANY_EMAIL
        value: infosukunix@gmail.com
      - key: COMPANY_PHONE
        value: "+91 8866279140"
      - key: COMPANY_WHATSAPP
        value: "918866279140"
      - key: WEBSITE_URL
        value: https://sukunix.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        value: infosukunix@gmail.com
      - key: EMAIL_PASS
        sync: false # Set securely in Render dashboard
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render dashboard
